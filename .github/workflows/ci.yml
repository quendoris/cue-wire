name: CueWire

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI (no external crates)
        run: cargo build --locked --offline --all-targets
      - name: Pure unit and integration tests
        run: cargo test --locked --offline --all-targets
      - name: Generate and validate offline mixer WAV preview
        run: |
          cargo run --locked --offline --example mixer_preview -- --out /tmp/cuewire-mixer-preview --seconds 2
          python3 tests/preview_wav.py /tmp/cuewire-mixer-preview
      - name: Generate and validate loudness-leveling music WAV
        run: |
          cargo run --locked --offline --example dynamics_preview -- --out /tmp/cuewire-dynamics-preview --section-seconds 3
          python3 tests/dynamics_preview.py /tmp/cuewire-dynamics-preview 3
      - name: Generate and audit deterministic noisy-voice restoration
        run: |
          cargo run --locked --offline --example voice_restore -- --out /tmp/cuewire-voice-preview --seconds 3
          python3 tests/audit_voice_preview.py /tmp/cuewire-voice-preview
          python3 tests/voice_quality.py /tmp/cuewire-voice-preview
          cp /tmp/cuewire-voice-preview/voice_after.wav /tmp/cuewire-voice-first.wav
          cargo run --locked --offline --example voice_restore -- --out /tmp/cuewire-voice-preview --seconds 3
          cmp /tmp/cuewire-voice-first.wav /tmp/cuewire-voice-preview/voice_after.wav
      - name: Isolate voice restoration stages for quality diagnosis
        if: github.event_name == 'workflow_dispatch'
        run: |
          cargo run --locked --offline --example voice_restore -- --out /tmp/cuewire-stage-no-processing --seconds 3 --no-highpass --no-denoise --no-expander --no-leveler --bed-off
          python3 tests/voice_quality.py /tmp/cuewire-stage-no-processing --diagnostic
          cargo run --locked --offline --example voice_restore -- --out /tmp/cuewire-stage-spectral-only --seconds 3 --no-highpass --no-expander --no-leveler --bed-off
          python3 tests/voice_quality.py /tmp/cuewire-stage-spectral-only --diagnostic
          cargo run --locked --offline --example voice_restore -- --out /tmp/cuewire-stage-filtered --seconds 3 --no-expander --no-leveler --bed-off
          python3 tests/voice_quality.py /tmp/cuewire-stage-filtered --diagnostic
          cargo run --locked --offline --example voice_restore -- --out /tmp/cuewire-stage-no-leveler --seconds 3 --no-leveler --bed-off
          python3 tests/voice_quality.py /tmp/cuewire-stage-no-leveler --diagnostic
      - name: Sweep voice suppression strengths (manual diagnostics)
        if: github.event_name == 'workflow_dispatch'
        run: |
          for strength in 0.35 0.8 1.3 1.7 2.2; do
            echo "--- voice denoising profile strength=$strength ---"
            cargo run --locked --offline --example voice_restore -- --out "/tmp/cuewire-voice-sweep-$strength" --seconds 3 --strength "$strength"
            python3 tests/voice_quality.py "/tmp/cuewire-voice-sweep-$strength"
          done
      - name: Hotkey safety preflight and scoped emergency (fake systemctl only)
        run: |
          bash -n tools/cuewire_scope.sh
          python3 -m py_compile tools/cuewire_hotkeys.py tests/test_hotkeys.py
          python3 tests/test_hotkeys.py
      - name: H2 physical NumPad gesture interpreter and mock Hyprland IPC
        run: |
          python3 -m py_compile tools/cuewire_keypad.py tools/cuewire_keypad_audit.py tests/test_keypad.py tests/test_keypad_audit.py
          python3 tests/test_keypad.py
          python3 tests/test_keypad_legacy.py
          python3 tests/test_keypad_audit.py
          python3 tools/cuewire_keypad.py render > /tmp/cuewire-keypad-preview.lua
          test "$(grep -c 'hl.bind(' /tmp/cuewire-keypad-preview.lua)" -eq 32
      - name: M5 read-only AEC playback-reference discovery (mock pactl)
        run: |
          python3 -m py_compile tools/voice_aec_inspect.py tests/test_voice_aec_inspect.py
          python3 tests/test_voice_aec_inspect.py
      - name: M4 raw physical microphone capture ownership and PCM validation (mock only)
        run: |
          python3 -m py_compile tools/voice_raw_capture.py tests/test_voice_raw_capture.py
          python3 tests/test_voice_raw_capture.py
      - name: M4 ALSA fallback capture (mock physical card only)
        run: |
          python3 -m py_compile tools/voice_alsa_capture.py tests/test_voice_alsa_capture.py
          python3 tests/test_voice_alsa_capture.py
      - name: Fake PipeWire end-to-end process and cleanup smoke
        run: python3 tests/fake_runtime.py target/debug/cuewire
      - name: Show CLI and command validation
        run: |
          cargo run --locked --offline -- --help
          if cargo run --locked --offline -- run --mic invalid; then
            echo "FAIL: bad CLI unexpectedly accepted"
            exit 1
          fi
      - name: No system service or default-device modification
        run: |
          ! grep -R -E 'set-default|systemctl enable|pactl load-module|pw-link @DEFAULT' src/
          echo "Static no-default-change guard: PASS"

