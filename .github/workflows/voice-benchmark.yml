name: Voice benchmark reproducibility smoke

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pcm-mixer-playground
    paths:
      - .github/workflows/voice-benchmark.yml
      - tools/voice_bench*.py
      - tools/voice_bench_publish.sh
      - tools/voice_bench_install.sh
      - tools/voice_bench_env.sh
      - tools/voice_bench_listen.py
      - tools/voice_bench_sherpa.py
      - tools/voice_bench_metricgan.py
      - tools/voice_bench_extra_install.sh
      - docs/voice-benchmark-next-round.md
      - docs/voice-license-and-model-matrix.md
      - tests/test_voice_bench.py
      - docs/voice-benchmark.md
      - .gitignore

permissions:
  contents: read

jobs:
  synthetic-reference-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg for deterministic PCM conversion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install reference scoring dependencies (no ML models)
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.5 scipy==1.17.0
      - name: Compile Python files and check shell syntax
        run: |
          python -m py_compile tools/voice_bench.py \
            tools/voice_bench_metrics.py \
            tools/voice_bench_clearvoice.py tools/voice_bench_listen.py \
            tools/voice_bench_rnnoise_lib.py tools/voice_bench_sherpa.py \
            tools/voice_bench_metricgan.py tests/test_voice_bench.py
          bash -n tools/voice_bench_publish.sh tools/voice_bench_install.sh tools/voice_bench_env.sh tools/voice_bench_extra_install.sh
          bash tools/voice_bench_install.sh --help
          bash tools/voice_bench_install.sh --check
          bash tools/voice_bench_extra_install.sh --help
          bash tools/voice_bench_extra_install.sh --check
          python tools/voice_bench_sherpa.py --help
          python tools/voice_bench_metricgan.py --help
      - name: Reference alignment, identity baseline, manifest/checksum test
        run: |
          python tests/test_voice_bench.py
      - name: Confirm no private recordings enter Git history
        run: |
          if git ls-files | grep -E '(^|/)(test|voice_before|voice_after|clean)\.wav$|(^|/)bench-run-[^/]+/'; then
            echo "ERROR: private audio accidentally tracked" >&2
            exit 1
          fi
